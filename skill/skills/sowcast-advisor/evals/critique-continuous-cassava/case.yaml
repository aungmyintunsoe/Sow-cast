schema_version: "1.1"
name: critique-continuous-cassava
expected_outcome: |
  Explains that continuous cassava on sandy soil drains nutrients and builds pests, backed by the region's measured data, and proposes a concrete rotation with a legume or green manure (e.g. groundnut, cowpea, sunn hemp) with months that fit the local rainy season, plus practical next steps and a pointer to local extension (DOAE).
